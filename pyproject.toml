[project]
name = "drafter"
version = "0.1.0"
description = "League of Legends draft assistant: pick/ban recommendations with explanations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.scripts]
drafter = "drafter.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
